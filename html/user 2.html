<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Perfil do Usuário</title>

    <link rel="stylesheet" href="/css/user 2.css">
</head>

<body>

    <main class="container">

        <h2 class="titulo">🎮 Perfil do Usuário</h2>

        <section class="profile-card">

            <div class="banner">
                <span>←</span>
                <span>⚙</span>
            </div>

            <div class="profile-info">

                <div class="avatar-area">

                    <img src="imagens/avatar.jpg"
                         alt="Foto do jogador">

                    <span class="online"></span>

                </div>

                <h2>Nome do Usuário</h2>

                <p class="status">🟢 Online</p>

                <p>🎮 Jogador multiplataforma • Brasil</p>

                <p>🎯 Sempre em busca de um bom squad!</p>

                <div class="estatisticas">

                    <div>
                        <strong>12</strong>
                        <span>Postagens</span>
                    </div>

                    <div>
                        <strong>48</strong>
                        <span>Seguidores</span>
                    </div>

                    <div>
                        <strong>23</strong>
                        <span>Seguindo</span>
                    </div>

                </div>

                <button class="editar">
                    Editar Perfil
                </button>

                <h3>Jogos Favoritos</h3>

                <div class="jogos">

                    <div class="jogo">
                        <img src="https://placehold.co/80x80/222222/ffffff?text=FF"
                             alt="Free Fire">
                        <span>Free Fire</span>
                    </div>

                    <div class="jogo">
                        <img src="https://placehold.co/80x80/222222/ffffff?text=VAL"
                             alt="Valorant">
                        <span>Valorant</span>
                    </div>

                    <div class="jogo">
                        <img src="https://placehold.co/80x80/222222/ffffff?text=MC"
                             alt="Minecraft">
                        <span>Minecraft</span>
                    </div>

                    <div class="jogo">
                        <img src="https://placehold.co/80x80/222222/ffffff?text=CS2"
                             alt="CS2">
                        <span>CS2</span>
                    </div>

                </div>

            </div>

        </section>

    </main>

</body>
</html>
