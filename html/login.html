<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PlayLink - Login / Cadastro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body>
  <div class="page-wrapper">
    <!-- Cabeçalho superior esquerdo -->
    <header class="top-brand">
      <svg class="mini-gamepad" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="2" y="6" width="20" height="12" rx="6" />
        <path d="M6 12h4M8 10v4" />
        <circle cx="15" cy="11" r="1" fill="currentColor" />
        <circle cx="17" cy="13" r="1" fill="currentColor" />
      </svg>
      <span>Login / Cadastro</span>
    </header>

    <!-- Card Principal -->
    <main class="auth-container">
      <div class="auth-card">
        
        <!-- Painel Esquerdo (Banner Azul/Roxo Gamer) -->
        <section class="left-panel">
          <div class="bg-shapes">
            <span class="shape shape-1"></span>
            <span class="shape shape-2"></span>
            <span class="shape shape-3"></span>
          </div>

          <div class="left-content">
            <!-- Ícone grande do controle -->
            <div class="gamepad-badge">
              <svg viewBox="0 0 64 44" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M18.5 4C11.2 4 6.5 9.8 5.2 17.8L3.2 30.2C2.3 35.8 6.6 40 11.6 40C15.1 40 18.2 38 19.8 34.9L22.2 30.2H41.8L44.2 34.9C45.8 38 48.9 40 52.4 40C57.4 40 61.7 35.8 60.8 30.2L58.8 17.8C57.5 9.8 52.8 4 45.5 4H18.5Z" fill="#FFFFFF"/>
                <!-- D-pad esquerdo -->
                <rect x="15" y="13" width="3.5" height="11" rx="1" fill="#4B49D8"/>
                <rect x="11.25" y="16.75" width="11" height="3.5" rx="1" fill="#4B49D8"/>
                <!-- Botões direitos -->
                <circle cx="46" cy="14.5" r="2.2" fill="#4B49D8"/>
                <circle cx="50.5" cy="18.5" r="2.2" fill="#4B49D8"/>
                <circle cx="41.5" cy="18.5" r="2.2" fill="#4B49D8"/>
                <circle cx="46" cy="22.5" r="2.2" fill="#4B49D8"/>
              </svg>
            </div>

            <h1>Bem-vindo ao<br>PlayLink</h1>
            <p>Conecte-se. Jogue. Faça parte.</p>
          </div>
        </section>

        <!-- Painel Direito (Formulário) -->
        <section class="right-panel">
          <!-- Abas Entrar / Cadastrar -->
          <div class="tabs">
            <button type="button" class="tab-btn active" id="tab-login" onclick="switchTab('login')">Entrar</button>
            <button type="button" class="tab-btn" id="tab-register" onclick="switchTab('register')">Cadastrar</button>
          </div>

          <!-- Formulário de Login -->
          <form class="auth-form" id="form-login" onsubmit="event.preventDefault()">
            <div class="input-group">
              <span class="input-icon">
                <!-- Ícone usuário -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <circle cx="12" cy="8" r="4"/>
                  <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
              </span>
              <input type="text" placeholder="E-mail ou usuário" required />
            </div>

            <div class="input-group">
              <span class="input-icon">
                <!-- Ícone cadeado -->
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="5" y="11" width="14" height="10" rx="2"/>
                  <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                </svg>
              </span>
              <input type="password" id="login-password" placeholder="Senha" required />
              <button type="button" class="toggle-password" onclick="togglePassword('login-password')" aria-label="Mostrar senha">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
              </button>
            </div>

            <div class="form-options">
              <label class="remember-me">
                <input type="checkbox" checked />
                <span class="custom-checkbox"></span>
                <span>Lembrar de mim</span>
              </label>
              <a href="#" class="forgot-link">Esqueceu a senha?</a>
            </div>

            <button type="submit" class="btn-primary">Entrar</button>

            <div class="divider">
              <span>ou</span>
            </div>

            <div class="social-buttons">
              <button type="button" class="btn-social">
                <!-- Ícone Google -->
                <svg class="social-icon" viewBox="0 0 24 24">
                  <path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.7 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.8C6.2 7.2 8.9 5 12 5z"/>
                  <path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.7-.2-2.5H12v4.8h6.5c-.3 1.5-1.1 2.8-2.4 3.6l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/>
                  <path fill="#FBBC05" d="M5.3 14.8c-.2-.8-.4-1.6-.4-2.5s.2-1.7.4-2.5L1.6 7C.6 8.9 0 11.1 0 13.3s.6 4.4 1.6 6.3l3.7-2.8z"/>
                  <path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5l-3.7 2.8C3.5 21.1 7.4 24 12 24z"/>
                </svg>
                <span>Entrar com Google</span>
              </button>

              <button type="button" class="btn-social">
                <!-- Ícone Discord -->
                <svg class="social-icon" viewBox="0 0 24 24" fill="#5865F2">
                  <path d="M20.317 4.37a19.791 19.791 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994.021-.041.001-.09-.041-.106a13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.061 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
                </svg>
                <span>Entrar com Discord</span>
              </button>
            </div>

            <p class="switch-prompt">
              Não tem uma conta? <a href="#" onclick="switchTab('register'); return false;">Cadastre-se</a>
            </p>
          </form>

          <!-- Formulário de Cadastro (Oculto por padrão) -->
          <form class="auth-form hidden" id="form-register" onsubmit="event.preventDefault()">
            <div class="input-group">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <circle cx="12" cy="8" r="4"/>
                  <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                </svg>
              </span>
              <input type="text" placeholder="Nome de usuário" required />
            </div>

            <div class="input-group">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="3" y="5" width="18" height="14" rx="2"/>
                  <path d="m3 7 9 6 9-6"/>
                </svg>
              </span>
              <input type="email" placeholder="Seu e-mail" required />
            </div>

            <div class="input-group">
              <span class="input-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
                  <rect x="5" y="11" width="14" height="10" rx="2"/>
                  <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
                </svg>
              </span>
              <input type="password" id="reg-password" placeholder="Crie uma senha" required />
            </div>

            <button type="submit" class="btn-primary">Criar conta</button>

            <p class="switch-prompt">
              Já tem uma conta? <a href="#" onclick="switchTab('login'); return false;">Entrar</a>
            </p>
          </form>

        </section>
      </div>
    </main>
  </div>

  <script>
    function switchTab(tab) {
      const loginTab = document.getElementById('tab-login');
      const registerTab = document.getElementById('tab-register');
      const loginForm = document.getElementById('form-login');
      const registerForm = document.getElementById('form-register');

      if (tab === 'login') {
        loginTab.classList.add('active');
        registerTab.classList.remove('active');
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
      } else {
        registerTab.classList.add('active');
        loginTab.classList.remove('active');
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
      }
    }

    function togglePassword(inputId) {
      const input = document.getElementById(inputId);
      input.type = input.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
