<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu perfil Gamer</title>
     <link rel="icon" type="image/png" href="/img/img index/logo fundo removido.png">
     <link rel="stylesheet" href="/css/usuario.css">
</head>
<body>
    <div class="container">
        <h2>&#x1F4BE; Perfil do Usuário</h2>
        
        <div class="profile-card">
            <div class="banner"></div>
            <span>&#x1F519;Home</span>
            <span>&#x2699;Configurações</span>
        </div>

        <div class="avatar-area">
            <img id="fotoUsuario" src="avatar-padrao.png" alt="Foto do Usuário">
            <span class="online"></span>
        </div>

        <h2 id="nomeUsuario">Nome do Usuário</h2>
        <p class="status">&#x1F7E2;Online</p>
        <p class="plataforma">&#x1F3AE;Jogador multiplataforma ° Brasil</p>
        <p id="biografia">&#x1F3AF;Sempre em busca de um bom squad!</p>

        <div class="estatisticas">
            <div>
                <strong id="postagens">12</strong>
                <span>Postagens</span>
            </div>

            <div>
                <strong id="seguidores">48</strong>
                <span>seguidores</span>
            </div>

            <div>
                <strong id="seguindo">23</strong>
                <span>Seguindo</span>
            </div>
        </div>

        <button class="editar" onclick="editarperfil()">Editar Perfil</button>

        <h3>Jogos Favoritos</h3>

        <div class="jogos">
            <div>
                &#x1F52B;<span>Free Fire</span>
            </div>
            <div>
                &#x1F3AD;<span>Valorant</span>
            </div>
            <div>
                &#x1F6E0;<span>Minecraft</span>
            </div>
            <div>
                &#x1F52B;<span>CS2</span>
            </div>
        </div>

    </div>




    
 <script src="perfil.js"></script>   
</body>
</html>
